{% extends 'base.html' %}

{% block title %}Funkidz - Page non trouvée{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center bg-slate-50 py-24 relative overflow-hidden">
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-2xl mx-auto px-4 text-center space-y-8 relative z-10">
        <div class="relative inline-block">
            <span class="text-[120px] sm:text-[180px] font-black font-heading leading-none select-none text-slate-200">404</span>
            <span class="absolute inset-0 flex items-center justify-center text-7xl sm:text-8xl">🎈</span>
        </div>
        
        <div class="space-y-3">
            <h1 class="text-3xl sm:text-5xl font-black font-heading text-slate-900">Oups, page introuvable !</h1>
            <p class="text-base sm:text-lg text-slate-600 font-medium max-w-md mx-auto">
                La page que vous recherchez semble s'être envolée avec l'un de nos ballons magiques.
            </p>
        </div>

        <div class="pt-4">
            <a href="{% url 'home' %}" class="inline-flex items-center gap-2 px-8 py-4 bg-gradient-to-r from-brand-600 to-accent-pink text-white font-extrabold text-sm rounded-xl shadow-glow hover:shadow-xl hover:scale-105 transition duration-200">
                <span>Retourner à l'accueil</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </a>
        </div>
    </div>
</div>
{% endblock %}
