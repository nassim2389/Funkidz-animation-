{% extends 'base.html' %}

{% block title %}Funkidz - Paiement annulé{% endblock %}

{% block content %}
<div class="py-24 bg-background min-h-screen flex items-center">
    <div class="container mx-auto px-4">
        <div class="max-w-2xl mx-auto bg-white p-12 rounded-5xl border-8 border-candy-pink shadow-2xl text-center space-y-8">
            <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mx-auto">
                <svg class="w-12 h-12 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </div>
            <h1 class="text-5xl font-fun text-primary">Paiement non finalisé</h1>
            <p class="text-2xl text-slate-600 font-medium">
                La transaction a été interrompue. Votre réservation n'a pas pu être confirmée.
            </p>
            <div class="pt-6 flex flex-col sm:flex-row gap-4 justify-center">
                <a href="{% url 'booking-wizard' %}" class="px-10 py-4 bg-secondary text-white font-bold rounded-full hover:scale-105 transition">Réessayer la réservation</a>
                <a href="/" class="px-10 py-4 border-4 border-slate-100 text-slate-400 font-bold rounded-full hover:bg-slate-50 transition">Retour à l'accueil</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
