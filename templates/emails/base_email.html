<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #f1f5f9;
      padding: 30px 10px;
    }
    .main-card {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      border: 1px solid #e2e8f0;
    }
    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      padding: 32px 24px;
      text-align: center;
      color: #ffffff;
    }
    .header h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .header p {
      margin: 6px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }
    .content {
      padding: 32px 28px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-success {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }
    .badge-info {
      background-color: #e0e7ff;
      color: #4338ca;
      border: 1px solid #c7d2fe;
    }
    .badge-warning {
      background-color: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }
    .badge-danger {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .info-table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    .info-table tr {
      border-bottom: 1px solid #f1f5f9;
    }
    .info-table tr:last-child {
      border-bottom: none;
    }
    .info-table td {
      padding: 12px 6px;
      font-size: 14px;
      vertical-align: top;
    }
    .info-table .label {
      font-weight: 600;
      color: #64748b;
      width: 38%;
    }
    .info-table .value {
      color: #0f172a;
      font-weight: 500;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      background-color: #4f46e5;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .alert-box {
      background-color: #f8fafc;
      border-left: 4px solid #4f46e5;
      padding: 14px 18px;
      border-radius: 0 10px 10px 0;
      margin: 20px 0;
      font-size: 13.5px;
      color: #334155;
    }
    .footer {
      background-color: #f8fafc;
      padding: 24px 20px;
      text-align: center;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      color: #64748b;
    }
    .footer a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td align="center">
          <div class="main-card">
            <!-- HEADER -->
            <div class="header">
              <h1>🎈 {{ brand_name }}</h1>
              <p>{{ brand_slogan }}</p>
            </div>

            <!-- MAIN BODY -->
            <div class="content">
              {% block content %}{% endblock %}
            </div>

            <!-- FOOTER -->
            <div class="footer">
              <p style="margin: 0 0 8px 0; font-weight: 600; color: #475569;">{{ brand_name }} — Agence d'Animations Événementielles</p>
              <p style="margin: 0 0 8px 0;">
                ✉️ <a href="mailto:{{ support_email }}">{{ support_email }}</a> &nbsp;|&nbsp;
                📞 {{ support_phone }} &nbsp;|&nbsp;
                🌐 <a href="{{ site_url }}">{{ site_url }}</a>
              </p>
              <p style="margin: 0; font-size: 11px; color: #94a3b8;">
                © {{ current_year }} Funkidz Animation. Tous droits réservés.
              </p>
            </div>
          </div>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
