<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Funkidz - Événements & Animations Enfants d'Exception{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN & Alpine.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#EEF2FF',
                            100: '#E0E7FF',
                            500: '#6366F1',
                            600: '#4F46E5',
                            700: '#4338CA',
                            900: '#312E81',
                        },
                        accent: {
                            pink: '#EC4899',
                            rose: '#F43F5E',
                            amber: '#F59E0B',
                            emerald: '#10B981',
                            cyan: '#06B6D4',
                        },
                        surface: {
                            light: '#F8FAFC',
                            card: '#FFFFFF',
                            dark: '#0F172A',
                        }
                    },
                    fontFamily: {
                        heading: ['Outfit', 'sans-serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'glow': '0 0 25px -5px rgba(99, 102, 241, 0.4)',
                        'card-hover': '0 20px 40px -15px rgba(0, 0, 0, 0.07)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-slate-50 text-slate-800 font-sans antialiased text-base sm:text-lg leading-relaxed selection:bg-brand-500 selection:text-white;
            }
            h1, h2, h3, h4, h5, h6 {
                @apply font-heading tracking-tight;
            }
        }
        [x-cloak] { display: none !important; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #4F46E5 0%, #EC4899 50%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #4F46E5 0%, #EC4899 100%);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="flex flex-col min-h-screen relative overflow-x-hidden" x-data="{ atTop: true, scrollPercent: 0 }" 
      @scroll.window="atTop = (window.pageYOffset > 50 ? false : true); scrollPercent = (window.pageYOffset / (document.documentElement.scrollHeight - window.innerHeight)) * 100">
    
    {% include 'includes/cookie_banner.html' %}
    {% include 'includes/messages.html' %}
    
    <!-- Progress Indicator Bar -->
    <div class="fixed top-0 left-0 h-1 bg-gradient-to-r from-brand-500 via-accent-pink to-accent-amber z-[100] transition-all duration-150" :style="'width: ' + scrollPercent + '%'"></div>

    <!-- Back to Top Floating Button -->
    <button @click="window.scrollTo({top: 0, behavior: 'smooth'})" 
            x-show="!atTop" 
            x-transition:enter="transition ease-out duration-300 transform"
            x-transition:enter-start="opacity-0 translate-y-10 scale-75"
            x-transition:enter-end="opacity-100 translate-y-0 scale-100"
            x-transition:leave="transition ease-in duration-200 transform"
            x-transition:leave-start="opacity-100 translate-y-0 scale-100"
            x-transition:leave-end="opacity-0 translate-y-10 scale-75"
            class="fixed bottom-8 right-8 z-50 p-4 bg-brand-600 text-white rounded-full shadow-glow hover:bg-brand-700 transition-all duration-300 hover:scale-110 active:scale-95"
            aria-label="Retour en haut">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
    </button>

    {% include 'includes/navbar.html' %}

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}

    {% block extra_js %}{% endblock %}
</body>
</html>
