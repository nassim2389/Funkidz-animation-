{% extends 'base.html' %}

{% block title %}Funkidz - Connexion avec Google{% endblock %}

{% block content %}
<section class="min-h-[80vh] flex items-center justify-center bg-slate-50 py-16 px-4">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200/80 shadow-sm text-center">
        
        <div class="space-y-3">
            <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mx-auto shadow-inner">
                <svg class="w-8 h-8" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 font-heading">Connexion via Google</h1>
            <p class="text-xs text-slate-500 font-medium">Entrez votre adresse Google (Gmail) pour accéder instantanément à votre espace membre.</p>
        </div>

        <form class="space-y-4 text-left" action="{% url 'google-login' %}" method="POST">
            {% csrf_token %}
            <div class="space-y-1.5">
                <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Votre Adresse Gmail *</label>
                <input id="email" name="email" type="email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:border-brand-500 transition" placeholder="votre.email@gmail.com">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1.5">
                    <label for="first_name" class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Prénom</label>
                    <input id="first_name" name="first_name" type="text" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:border-brand-500 transition" placeholder="Votre prénom">
                </div>
                <div class="space-y-1.5">
                    <label for="last_name" class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Nom</label>
                    <input id="last_name" name="last_name" type="text" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:border-brand-500 transition" placeholder="Votre nom">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-extrabold text-sm rounded-xl transition duration-200 shadow-glow flex items-center justify-center gap-2">
                <span>Valider et Accéder à mon Espace</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </form>

        <div class="pt-4 border-t border-slate-100 text-xs text-slate-500">
            <a href="{% url 'login' %}" class="font-bold text-slate-600 hover:underline">← Retour à la connexion classique</a>
        </div>
    </div>
</section>
{% endblock %}
